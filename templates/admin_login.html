<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
  body { background:#000; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .box { background:#0d0d0d; border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:36px 30px; max-width:380px; width:100%; }
  h1 { font-size:22px; font-weight:900; margin-bottom:6px; }
  p { color:#888; font-size:13px; margin-bottom:24px; }
  .form-group { margin-bottom:16px; }
  label { display:block; font-size:11px; font-weight:700; color:#aaa; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:10px; color:#fff; font-size:14px; outline:none; }
  input:focus { border-color:#eb0028; }
  button { width:100%; padding:14px; background:#eb0028; color:#fff; border:none; border-radius:11px; font-weight:800; font-size:14px; cursor:pointer; margin-top:8px; }
  button:hover { opacity:.9; }
</style>
</head>
<body>
<div class="box">
  <h1>🔒 Admin Login</h1>
  <p>Enter credentials to access panel</p>
  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="user" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="pass" required>
    </div>
    <button type="submit">LOGIN →</button>
  </form>
</div>
</body>
</html>
